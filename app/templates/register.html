{% extends "base.html" %}

{% block title %}{{ t.register_title }} — {{ t.app_name }}{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-b from-paw-50/50 via-white to-slate-50">
    <div class="max-w-md w-full space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <div class="w-16 h-16 bg-paw-100 text-paw-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm">
                <i data-lucide="user-plus" class="w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">{{ t.register_title }}</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-2 font-medium">{{ t.register_subtitle }}</p>
        </div>

        <!-- Card Container -->
        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xl p-8 space-y-6">
            
            {% if error %}
            <div class="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold flex items-center space-x-2">
                <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 text-rose-600"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/register?lang={{ lang }}" method="POST" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        {{ t.register_name }} *
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </span>
                        <input 
                            type="text" 
                            name="name" 
                            required 
                            placeholder="{{ t.register_name_placeholder }}" 
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-paw-500 focus:bg-white transition-all"
                        >
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        {{ t.register_email }} *
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </span>
                        <input 
                            type="email" 
                            name="email" 
                            required 
                            placeholder="nuran@example.com" 
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-paw-500 focus:bg-white transition-all"
                        >
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        {{ t.register_password }} *
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </span>
                        <input 
                            type="password" 
                            name="password" 
                            required 
                            minlength="6"
                            placeholder="••••••••" 
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-paw-500 focus:bg-white transition-all"
                        >
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        {{ t.register_confirm_password }} *
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="shield-check" class="w-4 h-4"></i>
                        </span>
                        <input 
                            type="password" 
                            name="confirm_password" 
                            required 
                            minlength="6"
                            placeholder="••••••••" 
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-paw-500 focus:bg-white transition-all"
                        >
                    </div>
                </div>

                <button 
                    type="submit" 
                    class="w-full py-3.5 px-4 bg-paw-600 hover:bg-paw-700 text-white font-extrabold text-sm rounded-xl shadow-lg shadow-paw-600/25 transition-all flex items-center justify-center space-x-2"
                >
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span>{{ t.register_btn }}</span>
                </button>
            </form>

            <div class="pt-2 border-t border-slate-100 text-center text-xs font-semibold text-slate-500">
                {{ t.register_has_account }}
                <a href="/login?lang={{ lang }}" class="text-paw-600 font-extrabold hover:underline ml-1">
                    {{ t.nav_login }}
                </a>
            </div>

        </div>

    </div>
</div>
{% endblock %}
